name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the gate compares with the base branch's results
      - uses: astral-sh/setup-uv@v6
      - name: Python compiles
        run: uv run --python 3.13 python -m compileall -q agent faults mcp_servers memory
      - name: Alert rules are valid
        run: docker run --rm -v "$PWD/prometheus:/p" --entrypoint promtool quay.io/prometheus/prometheus:v3.13.1 check rules /p/alerts.yml
      - name: Score gate (agent must not get worse)
        run: python3 faults/gate.py ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
