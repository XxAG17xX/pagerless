# Pagerless's own layer, loaded last by dc.sh (ADR 0002).
# Relative paths resolve from shop/, the folder of the first compose file, hence the ../
services:
  prometheus:
    volumes:
      - ../prometheus/prometheus-config.yaml:/etc/prometheus/prometheus-config.yaml
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml
  # Our copy of the Shop's flag file, so faults/inject.py can flip flags without editing shop/.
  # Same target folder as the Shop's mount, so compose replaces it. flagd polls the file.
  flagd:
    volumes:
      - ../flagd:/etc/flagd
  flagd-ui:
    volumes:
      - ../flagd:/app/data
  opensearch:
    ports:
      - "9200:9200"  # fixed host port so mcp_servers/logs_mcp.py can find it (the Shop maps a random one)

  # Grafana once ate 233% CPU retrying a locked database, slowing the Shop enough to trip alerts.
  # frontend-proxy depends on it, so cap its CPU instead of removing it.
  grafana:
    deploy:
      resources:
        limits:
          cpus: "0.5"

  # The Shop gives these Go services a 20 MiB memory cap and GOMEMLIMIT=16MiB. Under the load
  # generator they spent their time garbage-collecting (product-catalog at 227% CPU on 12.5 MiB,
  # checkout at 300%), pushed p95 to 15 s and tripped ServiceSlow with no fault injected.
  product-catalog:
    environment:
      - GOMEMLIMIT=48MiB
    deploy:
      resources:
        limits:
          memory: 64M
  checkout:
    environment:
      - GOMEMLIMIT=48MiB
    deploy:
      resources:
        limits:
          memory: 64M

  # Pagerless's own database (not the Shop's): LangGraph checkpoints and, later, incident memory
  # (pgvector). Host port 5433 so it never clashes with a local Postgres.
  pagerless-db:
    image: pgvector/pgvector:pg17
    container_name: pagerless-db
    environment:
      POSTGRES_USER: pagerless
      POSTGRES_PASSWORD: pagerless  # local only, never exposed beyond this machine
      POSTGRES_DB: pagerless
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pagerless-db:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pagerless-db:
