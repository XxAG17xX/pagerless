# Pagerless's own layer, loaded last by dc.sh (ADR 0002).
# Relative paths resolve from shop/, the folder of the first compose file, hence the ../
services:
  prometheus:
    volumes:
      - ../prometheus/prometheus-config.yaml:/etc/prometheus/prometheus-config.yaml
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml
  # Our copy of the Shop's flag file, so faults/inject.py can flip flags without editing shop/.
  # Same target folder as the Shop's mount, so compose replaces it. flagd polls the file.
  flagd:
    volumes:
      - ../flagd:/etc/flagd
  flagd-ui:
    volumes:
      - ../flagd:/app/data
  opensearch:
    ports:
      - "9200:9200"  # fixed host port so mcp_servers/logs_mcp.py can find it (the Shop maps a random one)
