<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pagerless architecture"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#52514e"/></marker></defs><rect width="980" height="470" rx="10" fill="#fcfcfb"/><rect x="24" y="64" width="236" height="78" rx="9" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="38" y="89" font-size="15" font-weight="600" fill="#0b0b0b">Fault harness</text><text x="38" y="109" font-size="12.5" fill="#52514e">faults/inject.py: breaks the shop</text><text x="38" y="126" font-size="12.5" fill="#52514e">and keeps the answer key</text><rect x="24" y="186" width="236" height="70" rx="9" fill="#f7f6f2" stroke="#cfcec8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="38" y="211" font-size="15" font-weight="600" fill="#0b0b0b">OpenTelemetry Demo</text><text x="38" y="231" font-size="12.5" fill="#52514e">borrowed: 20 services in Docker</text><rect x="24" y="300" width="236" height="78" rx="9" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="38" y="325" font-size="14" font-weight="600" fill="#0b0b0b">Prometheus, Jaeger, OpenSearch</text><text x="38" y="345" font-size="12.5" fill="#52514e">metrics, traces, logs,</text><text x="38" y="362" font-size="12.5" fill="#52514e">plus my alert rules</text><path d="M142,142 V180" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="152" y="166" font-size="12" fill="#52514e" text-anchor="start">breaks it on purpose</text><path d="M142,256 V294" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="152" y="280" font-size="12" fill="#52514e" text-anchor="start">telemetry</text><text x="300" y="138" font-size="12" font-weight="600" letter-spacing="0.06em" fill="#52514e">MCP SERVERS, READ-ONLY</text><rect x="300" y="150" width="200" height="46" rx="8" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="314" y="170" font-size="14" font-weight="600" fill="#0b0b0b">metrics</text><text x="314" y="187" font-size="12" fill="#52514e">Prometheus</text><rect x="300" y="208" width="200" height="46" rx="8" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="314" y="228" font-size="14" font-weight="600" fill="#0b0b0b">traces</text><text x="314" y="245" font-size="12" fill="#52514e">Jaeger</text><rect x="300" y="266" width="200" height="46" rx="8" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="314" y="286" font-size="14" font-weight="600" fill="#0b0b0b">logs</text><text x="314" y="303" font-size="12" fill="#52514e">OpenSearch</text><rect x="300" y="324" width="200" height="46" rx="8" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="314" y="344" font-size="14" font-weight="600" fill="#0b0b0b">incident memory</text><text x="314" y="361" font-size="12" fill="#52514e">pgvector + full-text</text><rect x="556" y="168" width="214" height="150" rx="9" fill="#e7f0fb" stroke="#2a78d6" stroke-width="1.2"/><text x="570" y="193" font-size="15" font-weight="600" fill="#0b0b0b">Agent (Claude API)</text><text x="570" y="213" font-size="12.5" fill="#52514e">plain loop, or LangGraph</text><text x="570" y="230" font-size="12.5" fill="#52514e">with Postgres checkpoints,</text><text x="570" y="247" font-size="12.5" fill="#52514e">so a crashed run resumes</text><path d="M506,243 H550" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/><text x="528" y="234" font-size="12" fill="#52514e" text-anchor="middle">MCP</text><path d="M260,360 H278 V420 H663 V324" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="413" font-size="12" fill="#52514e" text-anchor="start">my alert fires: investigation starts</text><rect x="810" y="92" width="150" height="64" rx="9" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="824" y="117" font-size="14" font-weight="600" fill="#0b0b0b">Cited report</text><text x="824" y="137" font-size="12.5" fill="#52514e">root cause + evidence</text><rect x="810" y="196" width="150" height="64" rx="9" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="824" y="221" font-size="14" font-weight="600" fill="#0b0b0b">Human approves</text><text x="824" y="241" font-size="12.5" fill="#52514e">any fix, or not</text><rect x="810" y="300" width="150" height="78" rx="9" fill="#f2f1ed" stroke="#cfcec8" stroke-width="1.2"/><text x="824" y="325" font-size="14" font-weight="600" fill="#0b0b0b">Score</text><text x="824" y="345" font-size="12.5" fill="#52514e">vs the answer key;</text><text x="824" y="362" font-size="12.5" fill="#52514e">CI fails below a floor</text><path d="M770,200 H790 V124 H804" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M885,156 V190" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M770,290 H790 V339 H804" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M142,64 V40 H970 V339 H966" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="560" y="33" font-size="12" fill="#52514e" text-anchor="middle">answer key, hidden from the agent</text></svg>
