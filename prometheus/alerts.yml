groups:
  - name: pagerless
    rules:
      - alert: CheckoutFailing
        # Share of PlaceOrder calls that errored over the last 5 minutes, above 20%.
        expr: sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder", status_code="STATUS_CODE_ERROR"}[5m])) / sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder"}[5m])) > 0.2
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Checkout is failing for customers"

      - alert: CheckoutNoOrders
        # CheckoutFailing counts failed orders, so it goes quiet if checkout stops reporting
        # orders at all (seen 2026-09-30 when killing payment cascaded). The load generator
        # always orders, so zero orders for 5 minutes means checkout is broken.
        # "or vector(0)" makes a missing series count as zero instead of as no data.
        expr: (sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_name="oteldemo.CheckoutService/PlaceOrder"}[5m])) or vector(0)) == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Checkout has recorded no orders for 5 minutes"

      # The two rules below watch every backend service, so faults outside checkout fire too.
      # They count SERVER spans only (what a service answers its callers) and leave out the edge
      # (frontend, frontend-proxy, frontend-web, load-generator), which repeats every downstream
      # error and has background errors even when healthy, and flagd, whose streams stay open for minutes.
      - alert: ServiceErrors
        # 5%: a healthy backend answers with ~0% errors, and each catalogue fault pushes its service to 10% or more.
        expr: sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", service_name!~"frontend.*|load-generator|flagd"}[5m])) / sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", service_name!~"frontend.*|load-generator|flagd"}[5m])) > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service_name }} is failing more than 5% of its requests"

      - alert: ServiceSlow
        # 1 s: healthy backends answer at p95 under ~100 ms (cart 43 ms, ad 95 ms on 2026-11-21), so 10x headroom.
        expr: histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", service_name!~"frontend.*|load-generator|flagd"}[5m]))) > 1000
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service_name }} p95 latency is above 1 s"
